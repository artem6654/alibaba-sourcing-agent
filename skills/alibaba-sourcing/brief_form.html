<!--
Brief form template for the alibaba-sourcing skill.
Render with the elicitation widget (see SKILL.md, "Brief checklist").
Translate every visible label, option and placeholder into the user's language.
Replace Block A (q01-q10) with 6-10 questions for the actual product; keep at least one group as cards.
Keep blocks B-D, the numbering, the [default] in each label, data-multi="true", the "Other" option and both footer buttons.
Remove these comments before rendering: the widget forbids HTML comments.
-->
<h2 class="sr-only">Sourcing brief for PRODUCT on Alibaba; every question allows several answers and a custom answer</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Brief details: PRODUCT</span>
  </div>
  <div class="elicit-body">

<!-- Block A: product questions, example of a card group -->
    <div class="elicit-group">
      <label class="elicit-question">1. Which type do we source? [MOST COMMON TYPE]</label>
      <div class="elicit-pills" data-name="q01_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="TYPE A" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-box" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">TYPE A</span><br><span style="font-size:11px; color:var(--text-muted)">short subtitle</span></span></button>
        <button type="button" class="elicit-pill" data-value="TYPE B" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-package" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">TYPE B</span><br><span style="font-size:11px; color:var(--text-muted)">short subtitle</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q01_type" placeholder="Describe the type">
    </div>

<!-- Block A: plain pill groups q02-q10 (size, material, color, parts, key specs...) -->
    <div class="elicit-group">
      <label class="elicit-question">2. QUESTION ABOUT A PRICE-DRIVING SPEC? [DEFAULT]</label>
      <div class="elicit-pills" data-name="q02_spec" data-multi="true">
        <button type="button" class="elicit-pill" data-value="OPTION 1">OPTION 1</button>
        <button type="button" class="elicit-pill" data-value="OPTION 2">OPTION 2</button>
        <button type="button" class="elicit-pill" data-value="OPTION 3">OPTION 3</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q02_spec" placeholder="Other answer">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Do you have a photo or link of a sample?</label>
      <div class="elicit-files" data-name="sample_photo">
        <label class="elicit-dropzone">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.5 13a.5.5 0 0 1 .5.5v2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-2a.5.5 0 0 1 1 0v2a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 .5-.5M10 3a.5.5 0 0 1 .374.168l4 4.5.059.082a.5.5 0 0 1-.732.65l-.075-.068L10.5 4.814V13.5a.5.5 0 0 1-1 0V4.814L6.374 8.332a.5.5 0 0 1-.748-.664l4-4.5.08-.071A.5.5 0 0 1 10 3"/></svg>
          <span>Choose file</span>
          <input type="file" multiple>
        </label>
      </div>
      <textarea class="elicit-textarea" data-name="sample_link_text" placeholder="or paste a link / describe the sample"></textarea>
    </div>

<!-- Block B: order -->
    <div class="elicit-group">
      <label class="elicit-question">11. How many pieces? Pick one or several tiers. [500]</label>
      <div class="elicit-pills" data-name="q11_quantity" data-multi="true">
        <button type="button" class="elicit-pill" data-value="300">300</button>
        <button type="button" class="elicit-pill" data-value="500">500</button>
        <button type="button" class="elicit-pill" data-value="1000">1000</button>
        <button type="button" class="elicit-pill" data-value="3000">3000</button>
        <button type="button" class="elicit-pill" data-value="5000">5000</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q11_quantity" placeholder="Quantity, pcs">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">12. Target EXW price per unit, USD? [none, negotiate from the best quotes]</label>
      <textarea class="elicit-textarea" data-name="q12_target_price" placeholder="e.g. 0.05 USD at 5000 pcs"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">13. Where will you sell? Only used to choose certifications. [EU]</label>
      <div class="elicit-pills" data-name="q13_market" data-multi="true">
        <button type="button" class="elicit-pill" data-value="EU">EU</button>
        <button type="button" class="elicit-pill" data-value="Poland">Poland</button>
        <button type="button" class="elicit-pill" data-value="UK">UK</button>
        <button type="button" class="elicit-pill" data-value="USA">USA</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q13_market" placeholder="Country">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">14. Which certificates and documents are required? [I will suggest them for the country and product]</label>
      <div class="elicit-pills" data-name="q14_certs" data-multi="true">
        <button type="button" class="elicit-pill" data-value="CERT 1">CERT 1</button>
        <button type="button" class="elicit-pill" data-value="CERT 2">CERT 2</button>
        <button type="button" class="elicit-pill" data-value="CERT 3">CERT 3</button>
        <button type="button" class="elicit-pill" data-value="Suggest for me">Suggest for me</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q14_certs" placeholder="Other documents">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">15. Packaging? [poly bag, no box]</label>
      <div class="elicit-pills" data-name="q15_packaging" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Poly bag">Poly bag</button>
        <button type="button" class="elicit-pill" data-value="Color box">Color box</button>
        <button type="button" class="elicit-pill" data-value="Bulk">Bulk</button>
        <button type="button" class="elicit-pill" data-value="EAN barcode">EAN barcode</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q15_packaging" placeholder="Packaging">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">16. Logo or private label? [not needed]</label>
      <div class="elicit-pills" data-name="q16_logo" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Not needed">Not needed</button>
        <button type="button" class="elicit-pill" data-value="On the product">On the product</button>
        <button type="button" class="elicit-pill" data-value="On the packaging">On the packaging</button>
        <button type="button" class="elicit-pill" data-value="Own insert">Own insert</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q16_logo" placeholder="Where and how">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">17. Sample before ordering? [yes, from finalists, paid by you]</label>
      <div class="elicit-pills" data-name="q17_sample" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Yes, from finalists">Yes, from finalists</button>
        <button type="button" class="elicit-pill" data-value="Only from the winner">Only from the winner</button>
        <button type="button" class="elicit-pill" data-value="No">No</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q17_sample" placeholder="Details">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">18. When do you need the goods? [not urgent]</label>
      <input type="date" class="elicit-date" data-name="q18_deadline">
    </div>

<!-- Block C: supplier selection -->
    <div class="elicit-group">
      <label class="elicit-question">19. How many factories should I contact? [15]</label>
      <input type="range" data-name="q19_factories" min="5" max="30" step="1" value="15">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted)"><span>5</span><span>30</span></div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">20. Which suppliers? [manufacturers only]</label>
      <div class="elicit-pills" data-name="q20_supplier_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Manufacturers">Manufacturers</button>
        <button type="button" class="elicit-pill" data-value="Trading companies">Trading companies</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">21. Rating and years on Alibaba? [4.5+, 3+ years]</label>
      <div class="elicit-pills" data-name="q21_rating" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Rating 4.5+">Rating 4.5+</button>
        <button type="button" class="elicit-pill" data-value="3+ years">3+ years</button>
        <button type="button" class="elicit-pill" data-value="Verified Supplier">Verified Supplier</button>
        <button type="button" class="elicit-pill" data-value="Trade Assurance">Trade Assurance</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q21_rating" placeholder="Rating, years">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">22. What matters most? [all three: 35/35/30]</label>
      <div class="elicit-pills" data-name="q22_priority" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Price">Price</button>
        <button type="button" class="elicit-pill" data-value="Quality">Quality</button>
        <button type="button" class="elicit-pill" data-value="Factory reliability">Factory reliability</button>
        <button type="button" class="elicit-pill" data-value="Lead time">Lead time</button>
      </div>
    </div>

<!-- Block D: how I work -->
    <div class="elicit-group">
      <label class="elicit-question">23. How should I handle messages? [on my own, no approval]</label>
      <div class="elicit-pills" data-name="q23_autonomy" data-multi="true">
        <button type="button" class="elicit-pill" data-value="On my own, no approval">On my own, no approval</button>
        <button type="button" class="elicit-pill" data-value="Approve the first message">Approve the first message</button>
        <button type="button" class="elicit-pill" data-value="Approve counter-offers">Approve counter-offers</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">24. How often should I check replies? [every 5 minutes while the session is open]</label>
      <div class="elicit-pills" data-name="q24_cadence" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Every 5 minutes">Every 5 minutes</button>
        <button type="button" class="elicit-pill" data-value="Every 15 minutes">Every 15 minutes</button>
        <button type="button" class="elicit-pill" data-value="Every hour">Every hour</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q24_cadence" placeholder="How often">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">25. What may I tell suppliers? [only city and postal code + Alibaba profile data]</label>
      <div class="elicit-pills" data-name="q25_disclosure" data-multi="true">
        <button type="button" class="elicit-pill" data-value="City and postal code">City and postal code</button>
        <button type="button" class="elicit-pill" data-value="Alibaba profile data">Alibaba profile data</button>
        <button type="button" class="elicit-pill" data-value="Company name">Company name</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q25_disclosure" placeholder="City and postal code">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">26. Where should I keep the workbook? [project folder, .xlsx]</label>
      <div class="elicit-pills" data-name="q26_storage" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Project folder, .xlsx">Project folder, .xlsx</button>
        <button type="button" class="elicit-pill" data-value="Online summary page">Online summary page</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="q26_storage" placeholder="Where">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Anything else I should know?</label>
      <textarea class="elicit-textarea" data-name="notes_text" placeholder="Any wishes"></textarea>
    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Use all defaults</button>
    <button type="button" class="elicit-submit">Start sourcing</button>
  </div>
</form>
